# `clippy::result_large_err` fires at 128 bytes by default.
#
# axum's handler error is `Response` (128 bytes), the idiomatic shape of every
# `Result<_, Response>` in web/*, server.rs and proxy/*; boxing it at each of
# those sites would only add noise. The gate's own refusal shapes
# (`OpenFailed`, `(GateHeaders, GatewayError)`, ...) are headers plus a
# `GatewayError`, ~200 bytes, returned once per request and never in a hot loop
# (their one outlier, the 368-byte `Route`, is boxed in `OpenFailed`). The
# threshold sits just above those so a genuinely new large error type still
# trips the lint.
large-error-threshold = 224

# web_sys's `MediaStream::clone` and `MediaStreamTrack::clone` are inherent
# methods that shadow `Clone::clone`: they are the JS `clone()`, a new stream of
# new live tracks. Holding one and stopping its tracks leaves the microphone
# open (chat-voice WP6's media probe caught exactly that). A handle is copied
# with `Clone::clone(&stream)`; a real JS clone needs an `#[allow]` and a reason.
#
# A transaction on the gateway's SQLite files that reads before it writes
# fails at once with "database is locked" when another connection committed
# in between (`SQLITE_BUSY_SNAPSHOT`; the busy timeout does not cover it).
# Every write transaction begins with `store::begin_write` (lmgw-core) or
# `quickdoc_core::store::begin_write`, which take the write lock at BEGIN
# (`BEGIN IMMEDIATE`). The calls below begin a deferred transaction; a
# transaction that only reads, for one consistent snapshot, may `#[allow]`
# one with its reason.
disallowed-methods = [
  { path = "web_sys::MediaStream::clone", reason = "the JS clone: new live tracks that must be stopped too; copy the handle with Clone::clone(&stream)" },
  { path = "web_sys::MediaStreamTrack::clone", reason = "the JS clone: a new live track that must be stopped too; copy the handle with Clone::clone(&track)" },
  { path = "sqlx::Pool::begin", reason = "a deferred transaction: a write transaction begins with store::begin_write (BEGIN IMMEDIATE); a read-only snapshot may #[allow] it with its reason" },
  { path = "sqlx::Pool::try_begin", reason = "a deferred transaction: a write transaction begins with store::begin_write (BEGIN IMMEDIATE); a read-only snapshot may #[allow] it with its reason" },
  { path = "sqlx::Connection::begin", reason = "a deferred transaction: a write transaction begins with store::begin_write (BEGIN IMMEDIATE); a read-only snapshot may #[allow] it with its reason" },
  { path = "sqlx::Acquire::begin", reason = "a deferred transaction: a write transaction begins with store::begin_write (BEGIN IMMEDIATE); a read-only snapshot may #[allow] it with its reason" },
]
