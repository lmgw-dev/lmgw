# The inner Podman (root inside the rootless outer container), as a containers.conf.d drop-in.
[containers]
# Each model container gets its own netns with pasta, so -p 127.0.0.1:<port>:8080 lands on the
# outer container's loopback. Netavark's bridge (the rootful default) would need route_localnet
# sysctls, and /proc/sys is read-only here.
netns = "pasta"
default_sysctls = []
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
