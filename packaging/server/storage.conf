# The inner Podman's store, as a drop-in: Podman 6 reads /usr/share/containers/storage.rootful.conf.d
# after storage.conf, so a plain /etc/containers/storage.conf loses to the vendor drop-in.
# The store is the /var/lib/containers volume alone (the confined variant, ruling 3); the spike's
# additional image store from the host is the shared variant's, which is not yet.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
