# cargo-nextest settings for this workspace (ci/check.sh runs the suite with it).
#
# Why nextest: it runs every test in a process of its own. lmgw-core's
# `tests/it` binary under plain `cargo test` is one process with 32 test
# threads, and on 2026-10-03 it spent 6597 s of system time against 2263 s of
# user time in a 359 s run: forked git/pdftotext children (a `pre_exec` rules
# out posix_spawn) and thread-heavy tests contending on one huge address
# space. The same tests one process each summed 1439 s of wall time and
# finished in 81 s; with the fixes that came with this file, 36 s.
#
# A process per test also makes every process-global guard in the suites (the
# `common::process_env_lock` mutex, the `NEXT_PREFIX` counters, which carry the
# pid) uncontended without touching them, so `cargo test` keeps working
# as before.

# Setup scripts are still experimental in nextest (0.9.146); NEXTEST_RUN_ID,
# which the API document's cache (below) is stamped with, came in 0.9.116.
nextest-version = { required = "0.9.116" }
experimental = ["setup-scripts"]

[store]
dir = "target/nextest"

# --- The admin API document, built once per run instead of once per test.
# Building it (`openapi::admin_doc()`) takes 3.4-3.8 s, and with a process per
# test every test that reads it built it again: a typed answer's round trip
# (`common::round_trips`, ~390 calls), the audit log's redaction list (every
# audited write), the API document's own tests. Measured 2026-11-20: ~600-750
# tests, about a third of the suite's summed test time. The setup script names
# a file (LMGW_OPENAPI_DOC_CACHE); in a debug build the first test that needs
# the document builds and writes it, stamped with this run's id and the test
# binary, and the rest read it (crates/lmgw-core/src/openapi/doc_cache.rs).
# `openapi_doc_cache::the_cached_document_is_the_one_this_build_makes` builds
# it for real and holds the file to it. The same script sets
# LMGW_TEST_ARGON2_FAST: password hashes with argon2's smallest parameters
# (accounts/password.rs; its unit tests keep RFC 9106's). Without the script
# (plain `cargo test`, Windows) every test builds the document and hashes as
# before.
# Measured 2026-11-20 on a 16-core desktop CPU (32 threads), nextest 0.9.146, 16 test
# threads, whole workspace, back to back: suite wall 460.7 s -> 269.8 s, summed
# junit test time 7317 s -> 4263 s, tests over 5 s 586 -> 100 (load 2.8 before
# the first run; 14 at the start of the second, the first's tail, so the second
# is the pessimistic one). Reproduce: build, then run, in a worktree of main
# and one of this change: `scripts/build-slot.sh cargo nextest run --workspace
# --no-run`, `scripts/build-slot.sh cargo nextest run --workspace`.
[scripts.setup.test-env]
command = { command-line = "scripts/nextest-test-env.sh", relative-to = "workspace-root" }

[profile.default]
# Every failure, not just the first: the summary should be the whole story.
fail-fast = false
# A test still running after 30 s is reported as SLOW (and listed at the
# end); one still running after 10 periods (5 min, ten times the slowest test
# today) is killed and fails as TIMEOUT, instead of hanging the check forever.
# lmgw-core's tests read this setting (tests/it/common/patience.rs): a wait
# says on stderr what it waits for each period, and gives up with the budget.
# scripts/flake-hunt.sh ends a copy of a test once it has had that budget.
slow-timeout = { period = "30s", terminate-after = 10 }
# Live per-test lines only for what needs attention ...
status-level = "slow"
# ... and the end of the run lists every failed, flaky and slow test by name:
# a test that passed only on a retry is never silently green.
final-status-level = "slow"
failure-output = "immediate-final"

[profile.default.junit]
# target/nextest/default/junit.xml: per-test times, for finding the slow tail.
path = "junit.xml"

# --- Known flakes: retried, and named FLAKY in the summary when a retry saved them.
# Add a test here only with the evidence next to it, and take it out when fixed.
# None today.

# --- Order: the long tests start first, so they do not run alone at the end.
# Measured 2026-10-03 (target/nextest/default/junit.xml has the current
# times): the live-container tests take 8-18 s, the realtime suites pace their
# audio in real time (3-8 s each), and a handful of admission tests wait out
# real queue timeouts.

[[profile.default.overrides]]
filter = 'package(lmgw-core) & binary(it) & (test(/::the_real_thing/) | test(/^image_live::/))'
priority = 100

[[profile.default.overrides]]
filter = 'package(lmgw-core) & binary(it) & (test(/^realtime_/) | test(/^vram_admission::(gate_follows_running_container|outside_vram_fallback|request_gate|ladder_|in_flight_claim|admission)::/) | test(/^modelinfo_real_files::/) | test(/^openapi_live::/))'
priority = 50

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = 'package(lmgw-core) & binary(it)'
setup = 'test-env'
