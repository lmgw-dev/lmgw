[workspace]
resolver = "2"
# First-party example agents (examples/agents/*) are ordinary members, so
# `cargo test --workspace` and `cargo fmt --all` cover them like the gateway.
members = ["crates/lmgw-core", "crates/lmgw-api-types", "crates/lmgw-client", "crates/lmgw-machine", "crates/lmgw-machine-helper", "crates/lmgw-private", "crates/lmgw-update", "crates/lmgw-server", "crates/lmgw-ui", "crates/lmgw-chat-ui", "crates/lmgw-ui-kit", "crates/quickdoc-core", "src-tauri", "examples/agents/folder-chat"]
# lmgw-ui and the Chat it mounts (lmgw-chat-ui) are wasm32-only (built by Trunk);
# keep them out of plain `cargo build`.
# lmgw-client builds for both: natively here, for wasm32 inside the dashboard
# (and on its own in ci/check.sh).
default-members = ["crates/lmgw-core", "crates/lmgw-api-types", "crates/lmgw-client", "crates/lmgw-machine", "crates/lmgw-machine-helper", "crates/lmgw-private", "crates/lmgw-update", "crates/lmgw-server", "crates/quickdoc-core", "src-tauri", "examples/agents/folder-chat"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

# Keep debug assertions off here: the shell treats `cfg!(debug_assertions)` as
# "this is a dev run" (src-tauri/src/dev_guard.rs) — a release build with them
# on would refuse to start without LMGW_DATA_DIR and key its audio as lmgw-dev.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Line tables only, not full DWARF: every backtrace frame still names its
# file and line (a test failure reads the same), but no variables or types
# for a debugger. Measured 2026-10-03: the tests/it binary 1.30 GB -> 0.59 GB,
# a rebuild after a lmgw-core change 28.8 s -> 26.1 s, after a test change
# 10.6 s -> 9.6 s. For a debugging session: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Trunk builds lmgw-ui with --release for bundle size; wasm-opt does the rest.
[profile.release.package.lmgw-ui]
opt-level = "s"

# The Chat was lmgw-ui's code until it became a crate of its own (chat-plane
# design, WP3b): it keeps the dashboard's size settings, here and below.
[profile.release.package.lmgw-chat-ui]
opt-level = "s"

# The debug `trunk build` (ci/check.sh, the dev loop). With full DWARF the
# dashboard's debug wasm was 2.28 GB, and with the Benchmarks page rust-lld
# crashed writing it (SIGSEGV in CustomSection::writeTo, 2026-09-29). Trunk's
# wasm-bindgen strips DWARF from dist/ anyway (no data-keep-debug), so none
# is emitted for this crate: the link input drops to 0.27 GB and wasm-bindgen
# reads a fraction of it. Panic messages keep their file:line (that is the
# panic location, not debug info), and index.html's data-no-demangle keeps
# the function names in dist/ as the linker wrote them — demangled, the
# monomorphized view types grew the name section fourfold, to 0.65 GB.
#
# Then the names went too (2026-10-20): the wasm `name` section was 238 MB of
# the 301 MB debug bundle (code 60 MB, data 2 MB), and a page took 26 s from
# navigation to main.content in WebKit and 12 s in Chrome, 15 s and 1.3 s
# once the debug server's own 11 s per fetch was fixed (web/ui.rs and sha2
# below). crates/lmgw-ui/build.rs links the debug wasm with --strip-all, as
# `strip` cannot (it gives rust-lld only --strip-debug for wasm32): dist/'s
# wasm is 63 MB, a page renders in 3.3 s in WebKit and 0.43 s in Chrome, and a
# `trunk build` after a one-line page change takes 31 s instead of 34.5 s
# (cargo 14.5 s either way, wasm-bindgen reads a fifth of the bytes). A stack
# trace shows wasm-function[N] for a name; the panic message keeps file:line.
# Measured the same day and not taken: opt-level 1 for this crate and all its
# dependencies (a custom profile, so host builds stay at 0) halves the wasm
# to 36 MB and renders in 0.95 s in WebKit and 0.15 s in Chrome (the hbars
# drive in WebKit 164 s instead of 215 s), but the same rebuild takes 43 s
# (cargo 36 s; codegen-units 1024 did not help), and every edit pays it; at
# opt-level 1 for the dependencies only, the code shrank just 60 to 56 MB.
[profile.dev.package.lmgw-ui]
debug = false

[profile.dev.package.lmgw-chat-ui]
debug = false

# Account passwords' argon2id (headless server design D12): one verification
# took 1753 ms unoptimised in a debug dev instance against 95 ms in release
# (2026-11-08, a 16-core desktop CPU), and the accounts suite verifies dozens.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# rubato's sinc loops (realtime audio resampling) are ~20x slower unoptimised:
# the realtime DSP tests take 21 s with it at opt-level 0 and 1.3 s at 3.
[profile.dev.package.rubato]
opt-level = 3

# The same for Smart Turn's Whisper front end (realtime `turn/mel.rs`): 800
# FFTs per score, which the session and corpus tests run on every pause.
[profile.dev.package.rustfft]
opt-level = 3

# Every reqwest client built reads and decodes the system trust store
# (rustls-platform-verifier → rustls-native-certs): 20 ms per client at
# opt-level 0, 3 ms with these two at 3, measured 2026-10-03 on Fedora's
# store. The test suites build thousands of clients.
[profile.dev.package.rustls-pki-types]
opt-level = 3

[profile.dev.package.rustls-native-certs]
opt-level = 3

# tiktoken's o200k_base encoder, built once per process (the count route,
# the knowledge bases' limits and quickdoc's budget): 450 ms at opt-level 0,
# 85 ms with tiktoken-rs and the crates its table build and its regex spend
# their time in at 3. Encoding gets the same speed-up.
[profile.dev.package.tiktoken-rs]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

# A debug lmgw-core reads every dashboard file from disk per request and
# rust-embed hashes it for the ETag: the 36 MB wasm took 0.67 s per fetch at
# opt-level 0 and 0.04 s with this at 3, the 301 MB one 0.35 s at 3 and 11 s
# before (at 0, and read twice per request until web/ui.rs read it once),
# measured 2026-10-20. WebKit fetches the wasm twice per page load (Trunk's
# preload and the module's own fetch).
[profile.dev.package.sha2]
opt-level = 3
