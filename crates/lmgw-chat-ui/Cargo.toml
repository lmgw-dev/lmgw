[package]
name = "lmgw-chat-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lmgw's Chat as a Leptos (CSR/WASM) library: threads, folders, the transcript, the composer, media and voice, mounted by lmgw's dashboard and by other hosts through the seams they provide (transport, location, session, live updates, preview frame, voice)"

[dependencies]
lmgw-api-types = { path = "../lmgw-api-types" }
# The voice panel's realtime protocol, voice state and truncate bookkeeping:
# the rules every client of the gateway runs (client-apps design §4.1).
lmgw-client = { path = "../lmgw-client" }
# The shared kit: the transport, catalog, formatting, prefs, generic widgets.
lmgw-ui-kit = { path = "../lmgw-ui-kit" }
leptos = { version = "0.8", features = ["csr"] }
futures = "0.3"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
# Awaiting the media and Web Audio promises (getUserMedia, addModule, resume,
# the shell's invoke) in the page's voice audio (chat-voice §11).
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CustomEvent", "HtmlDialogElement", "Navigator", "Clipboard", "Storage",
  "MediaQueryList", "CssStyleDeclaration",
  "HtmlElement", "HtmlTextAreaElement", "ResizeObserver", "ResizeObserverEntry",
  "DomRectReadOnly", "ScrollIntoViewOptions", "ScrollLogicalPosition",
  "DomRect", "EventInit", "HtmlCollection", "FocusOptions",
  "AbortController", "AbortSignal", "ReadableStream",
  "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent", "AddEventListenerOptions",
  # A tool call that waits for an approval opens its card.
  "HtmlDetailsElement",
  "NodeList",
  # Attachments: picked, dropped and pasted files; object URLs of bytes.
  "Blob", "BlobPropertyBag", "File", "FileList", "FormData", "HtmlInputElement", "Url",
  "FilePropertyBag", "DragEvent", "DataTransfer", "ClipboardEvent",
  # Voice (chat-voice §11.3). The realtime mode's socket:
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
  # the microphone and the device lists:
  "MediaDevices", "MediaDeviceInfo", "MediaDeviceKind", "MediaStream",
  "MediaStreamTrack", "MediaStreamConstraints", "MediaTrackConstraints",
  "MediaTrackSettings",
  # Web Audio: the playback and capture contexts, both worklets, the taps:
  "AudioContext", "AudioContextOptions", "AudioContextState", "BaseAudioContext",
  "AudioNode", "AudioParam", "AudioDestinationNode", "AudioWorklet", "Worklet",
  "AudioWorkletNode", "AudioWorkletNodeOptions", "MessagePort", "AnalyserNode",
  "GainNode", "MediaStreamAudioSourceNode",
  # and the visualisation's canvas.
  "HtmlCanvasElement",
  "IntersectionObserver", "IntersectionObserverEntry",
] }
