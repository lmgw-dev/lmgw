       through it toward you - local (Breeze blue) in the middle and widest,
       cloud to the sides (violet, teal). The lanes are in front of the gate:
       each leg's inner foot is cut along the lane edge, leaving a gap.
       No clipPath / mask / filter, so Qt and rsvg render it the same. -->
