# Drop-in: podman 6 reads /usr/share/containers/storage.rootful.conf.d after storage.conf,
# so a plain /etc/containers/storage.conf loses to the vendor drop-in.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# The host user's rootless store, mounted read-only (run.sh). Root inside the
# outer container sees it with the same uid mapping the host's rootless podman uses.
additionalimagestores = ["/var/lib/hoststore"]
