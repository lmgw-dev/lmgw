# Which lmgw-core `tests/it` modules `bash ci/check.sh --changed` runs for a
# diff. ci/changed.py reads this file and prints every pick with its reason.
#
# Most of the tree needs no entry, because of the naming convention:
#
#   * a file under crates/lmgw-core/src/ picks the modules named after its
#     first path component that is not listed in `skip`: src/realtime/** picks
#     realtime_*, src/vram/** picks vram_admission, src/web/chat_voice/**
#     picks chat_voice_*. A component with no module of its own is shortened
#     at its last underscore until one matches (src/web/chat_attach_gate.rs
#     picks chat_attach_*);
#   * a module's own file (tests/it/<module>.rs or tests/it/<module>/**)
#     picks that module;
#   * a file under tests/it/support/ or tests/it/common/ picks every module
#     that names it (`support::<file>`), and common/mod.rs picks all of them;
#   * a fixture under tests/fixtures/ picks the modules that name the file
#     (or, failing that, its directory).
#
# This file adds what the convention misses. `paths` are fnmatch patterns on
# the repo-relative path, where `*` also matches `/`. `modules` entries are a
# module name, a prefix ending in `_` (every module starting with it), a
# `module::test` path, or "*" (the whole binary). Entries add to the
# convention, they never remove from it. A path nothing matches is named in
# the output, covered only by the smoke set; the full `bash ci/check.sh`
# stays the gate before a merge.

# Directory names that group files rather than name a feature.
skip = ["web"]

# Always run, whatever the diff: cheap tests that cross the whole router.
smoke = [
    "route_walk",        # every CAPABILITY_TABLE row against the principal gate
    "openapi_coverage",  # every route documented
    "router",
    "migrations",
    "web_pages::the_spa_is_served_at_the_root_and_the_api_backs_its_pages",
]

[[map]]
paths = ["crates/lmgw-core/src/state.rs", "crates/lmgw-core/Cargo.toml"]
modules = ["*"]
why = "every suite builds its gateway from these"

[[map]]
paths = ["crates/lmgw-core/src/config.rs", "crates/lmgw-core/src/config/*"]
modules = ["config_hoisting", "web_pages", "migrations", "models_endpoint", "router",
           "mcp_selfadmin", "realtime_settings", "chat_voice_settings", "chat_stt_settings",
           "dev_boot_prefix"]
why = "settings and the snapshot; nearly every feature adds a field here, so the feature's own files pick its suites"

