# Format + test gate for pull requests and pushes to main, on GitHub's own
# runners. The same checks as ci/check.sh minus the advisory clippy / file-size
# report. Runs in fedora:latest because the Tauri build dependencies are
# installed as Fedora packages by ci/install-build-deps.sh (the release build
# uses the same image).
#
# Runner minutes are budgeted (2000 a month on GitHub's free plan), so changes
# that touch only documentation run nothing, and a run can also be started by
# hand from the Actions tab.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitlab-ci.yml"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitlab-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # A fresh checkout every run: incremental state is never reused, only cached
  # and restored at a cost.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    timeout-minutes: 10
    steps:
      # git so actions/checkout makes a real clone instead of a REST tarball.
      - name: Install rustfmt
        run: dnf -y install git-core cargo rustfmt
      - uses: actions/checkout@v7
      # cargo-fmt reads the workspace with `cargo metadata --no-deps`: nothing
      # is downloaded or compiled.
      - name: cargo fmt --check --all
        run: cargo fmt --check --all

  test:
    name: cargo test
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    # A cold run took 42 minutes before the prebuilt tauri-cli, 12 of them
    # compiling it. This bounds what a hung test can cost.
    timeout-minutes: 60
    env:
      # No debug info: a panic still names its file and line, and target/
      # stays small enough to cache. With line tables the runner's disk ran
      # out while compressing the cache.
      CARGO_PROFILE_DEV_DEBUG: none
    steps:
      # git for a real clone; tar + zstd for the cache inside the container.
      - name: Install checkout and cache tools
        run: dnf -y install git-core tar zstd
      - uses: actions/checkout@v7

      # Relative to the workspace, like .gitlab-ci.yml does. Set via
      # GITHUB_ENV: in a container job the `github.workspace` expression is the
      # HOST path, $GITHUB_WORKSPACE the container's.
      - name: Keep the cargo home and Trunk's tool cache in the workspace
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/.cache" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: bash ci/install-build-deps.sh
      # Not a build dependency but the RPM's runtime one: with it the tests that
      # drive the real pdftotext/pdftoppm run instead of skipping themselves.
      - name: Install poppler-utils
        run: dnf -y install poppler-utils

      # The cargo registry and the compiled dependencies, without the
      # workspace's own crates (they change with every commit), keyed on the
      # compiler and Cargo.lock; plus Trunk's wasm-bindgen/wasm-opt downloads.
      # After the toolchain install: the key reads `rustc -vV`. Saved even when
      # a test fails (the compile is the expensive part), but only from main:
      # PR runs restore main's cache instead of each adding a multi-GB entry of
      # their own to the repository's 10 GB cache budget. GitHub drops a cache
      # nobody read for a week.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: .cache/trunk
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # lmgw-core serves the dashboard bundle and tests/it/web_pages.rs asserts
      # it is really served, so it has to exist before the suite (as in
      # ci/check.sh).
      - name: trunk build (lmgw-ui)
        run: cd crates/lmgw-ui && trunk build

      - name: cargo test --workspace
        run: cargo test --workspace --locked
