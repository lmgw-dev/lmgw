[package]
name = "lmgw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted LLM API gateway (tray app)"

[dependencies]
lmgw-core = { path = "../crates/lmgw-core" }
# The machine summary the tray watches (machine_tray.rs).
lmgw-api-types = { path = "../crates/lmgw-api-types" }
# The install step and its host check (updater.rs); the feed is lmgw-core's.
lmgw-update = { path = "../crates/lmgw-update" }
# The machine check's fix (machine.rs, machine-check design WP7): the
# helper's wire (`helper::Event`, `Exit`, the unit's name), its install
# check and the plan's schema. Its events and answer are lmgw-api-types',
# which the dashboard reads too.
lmgw-machine = { path = "../crates/lmgw-machine" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The window's permission handler (media.rs, chat-voice §13.1). The same crate
# and version wry builds the webview with (locked 2.0.2): `PlatformWebview::inner`
# hands out its `WebView`, and the display-capture check is the re-exported
# `webkit2gtk::ffi` (webkit2gtk-sys), which the safe binding lacks.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
# Dropping tao's Wayland header bar so KWin decorates the window (main.rs,
# show_main_window). The version tao builds the window with.
gtk = "0.18"

# Links handed to the shell's `open` verb (shell_open.rs) and the pairing
# scheme's association (pairing.rs; Windows design §4.4). The version already
# in the lock through tokio and Tauri.
[target.'cfg(windows)'.dependencies]
# Windows has no system libopus to link against, so the app built there links
# the vendored one (lmgw-core's `opus-bundled`, cmake): `cargo tauri build`
# and the installer need no feature flag (Windows design §4.4, WP7).
lmgw-core = { path = "../crates/lmgw-core", features = ["opus-bundled"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The window's theme: the system's mode and accent from WinRT's UISettings
# (desktop_palette/win.rs). The version tao and wry build the window with.
windows = { version = "0.61.3", features = [
    "UI_ViewManagement",
    # The caption colour and the registry settings that decide it
    # (desktop_palette/win.rs).
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# A minted pairing link's token expiry, in the hand-off test (pairing.rs).
# The version lmgw-core uses.
chrono = "0.4.45"
# Fixture dirs for the portal detection tests (portal.rs).
tempfile = "3.27.0"
