# CI for lmgw — build the RPM on every push to `main` and publish it (plus an
# updater manifest the app polls) to this project's GitLab *generic* package
# registry. These are the private test builds, versioned <Cargo.toml version>+
# <pipeline IID> so each sorts after the release it follows; public releases are
# built from v<X.Y.Z> tags on GitHub by .github/workflows/release.yml, from the
# same ci/build.sh. Tags build nothing here.
#
# Self-hosted runners are tag-selected (docker / macos); the Linux build uses
# the `docker` tag for every job by default.
#
# REQUIRED CI/CD variable (Settings → CI/CD → Variables), set by the owner:
#   LMGW_UPDATE_DEPLOY_TOKEN — masked; the token of a project deploy token
#     (Settings → Repository → Deploy tokens) with ONLY the
#     `read_package_registry` scope. ci/build.sh compiles it into the test
#     builds, together with this registry's `latest/latest.json` as their update
#     feed, so an installed test build can read the private registry. It ends
#     up in the RPM, hence read-only. If you mark it *protected*, `main` must be
#     a protected branch or the variable never reaches the job. Missing, the
#     build still succeeds but warns, and its updater cannot reach the feed.
default:
  tags: [docker]

stages:
  - build
  - publish

# Only run for `main` (push, web, or API trigger). Skips MRs and other branches.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  # Keep cargo's registry/cache + installed binaries inside the project so
  # GitLab can cache them between pipelines.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  # Same for Trunk's tool cache: it fetches wasm-bindgen-cli and wasm-opt from
  # GitHub on first use, and $HOME is not cached. Without this every pipeline
  # re-downloads them and a GitHub hiccup fails the build.
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
  # ort's prebuilt ONNX Runtime (realtime design §13). Named explicitly:
  # with XDG_CACHE_HOME set, ort-sys extracts straight into it (no
  # ort.pyke.io subdirectory), next to Trunk's files.
  ORT_CACHE_DIR: "$CI_PROJECT_DIR/.cache/ort.pyke.io"
  # GitLab Runner's docker executor runs its clone, cache and artifact steps
  # under `umask 0000` unless this feature flag is on, so every checked-out
  # file was 0666, and tauri's rpm bundler copies a file's mode into the RPM:
  # an lmgw 0.5.0 CI build root-installed its icons and licence files world-writable.
  # With the flag the runner drops that umask call and instead chowns the
  # build directory to the build image's user (`id -u`/`id -g`, root in
  # fedora:latest). A job variable sets it unless the runner's config.toml
  # pins it under [runners.feature_flags]; the job log's "Running with
  # gitlab-runner" header lists it when it is on. ci/build.sh normalises the
  # modes anyway, and ci/rpm_guard.py fails the build on any RPM that still
  # ships a writable or privileged entry.
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"

build:
  stage: build
  # Track current Fedora so the RPM's webkit2gtk4.1 / appindicator SONAME deps
  # match the runtime host. Pin to a specific tag (e.g. fedora:42) if you'd
  # rather have reproducible builds than auto-tracking.
  image: fedora:latest
  interruptible: true
  # A runner's first, cold build has no cache yet and outlasts the default
  # one-hour limit; the limit stays visible here. GitLab caps it at the
  # runner's own maximum job timeout, if one is set (Admin → Runners).
  timeout: 2h
  variables:
    # Test builds trade a little runtime speed and binary size for parallel
    # codegen: Cargo.toml's `lto = true, codegen-units = 1` makes the big
    # crates' codegen and LTO single-threaded, the critical path of this job
    # whatever the runner's core count. Cargo reads these over Cargo.toml and
    # trunk's cargo call inherits them, so the wasm UI build gains too. Public
    # releases (.github/workflows/release.yml, same ci/build.sh) keep fat LTO
    # and one codegen unit. Not RUSTFLAGS: that would replace the config's.
    CARGO_PROFILE_RELEASE_LTO: "thin"
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  cache:
    key: cargo-lmgw
    paths:
      - .cargo/registry/
      - .cargo/bin/
      - .cache/trunk/
      # ort's prebuilt ONNX Runtime (realtime design §13): a 10 MB download
      # from pyke's CDN, unpacked to a 105 MB static library. Cached so a
      # pipeline neither re-downloads it nor fails on a CDN hiccup.
      - .cache/ort.pyke.io/
      - target/
  before_script:
    - bash ci/install-build-deps.sh
  script:
    # The guard's own test first (rpm-build and python3 come from ci/install-build-deps.sh):
    # a guard that stopped refusing things must fail here, not pass every RPM.
    - python3 ci/rpm_guard_test.py
    - bash ci/build.sh
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish:
  stage: publish
  image: fedora:latest
  needs: ["build"]
  # Serialize publishes so the mutable `latest/latest.json` upload can't race a
  # concurrent pipeline.
  resource_group: registry-latest
  before_script:
    - dnf -y install curl jq >/dev/null
  script:
    - bash ci/publish.sh
